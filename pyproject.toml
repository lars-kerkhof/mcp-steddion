[project]
name = "steddion-mcp"
version = "0.1.0"
description = "Steddion Energy MCP Server – day-ahead prices, imbalance prices, weather forecasts, and BESS business cases for the Dutch energy market."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
